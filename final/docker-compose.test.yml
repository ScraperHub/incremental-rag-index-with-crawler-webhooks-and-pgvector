services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "55432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 5s
      retries: 20

  tests:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      WEBHOOK_TOKEN: test-secret
      RECRAWL_INTERVAL_HOURS: "0"
      CRAWLBASE_TOKEN: ""
      OPENAI_API_KEY: ""
      CRAWLER_NAME: incremental-rag-test
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet -r requirements.txt pytest
      && pytest -q"
